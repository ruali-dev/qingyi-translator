<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">轻译 · Qingyi</title>
  <desc id="desc">A selected sentence in a paper flows through a right-click action into a lightweight translation card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#4C5DE8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#25326B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="1072" cy="46" r="116" fill="#DDE4FF" opacity="0.55"/>
  <circle cx="114" cy="386" r="98" fill="#E6EAFF" opacity="0.7"/>

  <g transform="translate(70 92)">
    <rect width="48" height="48" rx="15" fill="url(#accent)"/>
    <path d="M15 16h18M15 24h12M15 32h8" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M29 30l4 4 7-9" fill="none" stroke="#CFF4DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="104" fill="#18213A" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="55" font-weight="700">轻译</text>
    <text x="0" y="148" fill="#56617A" font-family="Segoe UI, sans-serif" font-size="27" font-weight="600" letter-spacing="4">QINGYI</text>
    <text x="0" y="201" fill="#6C758B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">选中 · 右键 · 读懂</text>
    <rect x="0" y="229" width="220" height="38" rx="19" fill="#E4E8FF"/>
    <circle cx="22" cy="248" r="5" fill="#5B6CF0"/>
    <text x="37" y="254" fill="#4250B8" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">ZOTERO 10 · WINDOWS</text>
  </g>

  <g transform="translate(430 58)" filter="url(#shadow)">
    <rect width="300" height="304" rx="20" fill="#FFF"/>
    <rect x="22" y="20" width="68" height="9" rx="4.5" fill="#D8DDEA"/>
    <rect x="22" y="38" width="114" height="9" rx="4.5" fill="#E6E9F1"/>
    <text x="22" y="86" fill="#343C51" font-family="Georgia, serif" font-size="14" font-weight="700">Attention mechanisms</text>
    <rect x="22" y="105" width="248" height="8" rx="4" fill="#E3E6ED"/>
    <rect x="22" y="124" width="226" height="8" rx="4" fill="#E3E6ED"/>
    <rect x="18" y="143" width="260" height="46" rx="8" fill="#FFF0A9" opacity="0.82"/>
    <text x="24" y="161" fill="#4B4650" font-family="Georgia, serif" font-size="11.5">The model learns contextual relationships</text>
    <text x="24" y="179" fill="#4B4650" font-family="Georgia, serif" font-size="11.5">without recurrent operations.</text>
    <rect x="22" y="210" width="252" height="8" rx="4" fill="#E3E6ED"/>
    <rect x="22" y="229" width="238" height="8" rx="4" fill="#E3E6ED"/>
    <rect x="22" y="248" width="246" height="8" rx="4" fill="#E3E6ED"/>
    <rect x="22" y="267" width="154" height="8" rx="4" fill="#E3E6ED"/>
  </g>

  <g transform="translate(690 166)" filter="url(#shadow)">
    <rect width="166" height="88" rx="12" fill="#252A37"/>
    <circle cx="18" cy="27" r="5" fill="#8E9BFF"/>
    <text x="32" y="32" fill="#FFF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">翻译选中文字</text>
    <path d="M14 51h138" stroke="#3E4556"/>
    <text x="18" y="72" fill="#9FA8BA" font-family="Segoe UI, sans-serif" font-size="12">Copy</text>
    <text x="122" y="72" fill="#747E91" font-family="Segoe UI, sans-serif" font-size="11">Ctrl+C</text>
  </g>

  <path d="M824 270c18 34 44 46 75 40" fill="none" stroke="#8B97ED" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
  <path d="M894 304l12 4-8 10" fill="none" stroke="#8B97ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(884 92)" filter="url(#shadow)">
    <rect width="262" height="220" rx="22" fill="#FFF"/>
    <rect x="20" y="18" width="42" height="26" rx="13" fill="#E7EAFF"/>
    <circle cx="34" cy="31" r="4" fill="#6272F3"/>
    <text x="44" y="35" fill="#4C5AD0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="700">轻译</text>
    <circle cx="228" cy="31" r="3" fill="#7D89EE">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="79" fill="#7A8498" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TRANSLATION</text>
    <text x="20" y="112" fill="#252D42" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">该模型无需循环操作，</text>
    <text x="20" y="138" fill="#252D42" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">即可学习上下文关系。</text>
    <rect x="20" y="165" width="222" height="1" fill="#EEF0F5"/>
    <circle cx="27" cy="190" r="5" fill="#57B781"/>
    <text x="40" y="195" fill="#697387" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">已完成 · 点击复制</text>
  </g>
</svg>

