[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qingyi-translator"
version = "0.2.2"
description = "A lightweight right-click LLM translator for Zotero papers on Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
]

[project.scripts]
qingyi = "paper_translator.app:main"

[project.urls]
Homepage = "https://github.com/ruali-dev/qingyi-translator"
Repository = "https://github.com/ruali-dev/qingyi-translator.git"
Issues = "https://github.com/ruali-dev/qingyi-translator/issues"
Changelog = "https://github.com/ruali-dev/qingyi-translator/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
